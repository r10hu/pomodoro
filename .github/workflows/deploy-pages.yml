name: Scan Images and Deploy to GitHub Pages

on:
  # Runs automatically whenever you push or upload files on your main branch
  push:
    branches: ["main", "master"]
  # Also adds a manual "Run workflow" button inside the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deployments cleanly if multiple uploads happen close together
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-scan assets/img/ and build images.json
        run: python3 scripts/scan-images.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site files for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
